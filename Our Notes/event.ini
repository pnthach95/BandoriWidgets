[Rainmeter]
update = 1000
accurateText = 1
dynamicWindowSize = 1
@Include=#@#\ournotes.inc

[Metadata]
name=Our Notes event info
author=pnthach95
information=Displays current event info, a countdown to start/end of event. To change settings go to @Resources\ournotes.inc. Data is fetched from https://bdon.yatta.moe
Version=3.0
license=Creative Commons Attribution-Non-Commercial-Share Alike 3.0

[lua]
measure=plugin
plugin=RainJIT
script=script.lua

[Variables]
MeterW=(9*#ImgSize#+#Padding#*2+40)*#Size#
MeterH=(312+#ImgSize#)*#Size#+(4.5*#Padding#)
startAt=0
endAt=0
dayoffset=0

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Backdrop=Dark
Corner=Round
DarkMode=1

[MeterBackground]
Meter=Shape
Shape=Rectangle (2*#Size#),(2*#Size#),#MeterW#,#MeterH#,(10*#Size#)|Fill Color #BGColor#|StrokeWidth (2*#Size#)|Stroke Color #BorderColor#
DynamicVariables=1
LeftMouseUpAction=[https://bdon.yatta.moe/tools/events/[#eventId]]
UpdateDivider=-1

[InfoStyle]
FontColor=#TextColor#
FontFace=#Font#
Antialias=1
FontSize=(16*#Size#)

[BonusImg]
PreserveAspectRatio=1
W=(#ImgSize#*#Size#)
X=(#Padding#*#Size#)

[MeterBGImg]
Meter=Image
MeasureName=BGImgDl
ImageName=%1
Group=Info
LeftMouseUpAction=[https://bdon.yatta.moe/tools/events/[#eventId]]
PreserveAspectRatio=2
W=#MeterW#+(4*#Size#)
H=#MeterW#/2
DynamicVariables=1

[MeterLogoImg]
Meter=Image
MeasureName=LogoImgDl
ImageName=%1
X=(2*#MeterW#)/3 - 20
Y=([MeterBGImg:H]/2 - [MeterLogoImg:H]/2)r
Group=Info
LeftMouseUpAction=[https://bdon.yatta.moe/tools/events/[#eventId]]
PreserveAspectRatio=1
W=#MeterW#/3
DynamicVariables=1

[MeterEventName]
Meter=String
Text=[#eventName]
MeterStyle=InfoStyle
DynamicVariables=1
UpdateDivider=-1
Group=Info
X=#Padding#
Y=([MeterLogoImg:H])R

[MeterEventType]
Meter=String
MeterStyle=InfoStyle
DynamicVariables=1
UpdateDivider=-1
Group=Info
X=r
Y=R

[MeterTimer1]
Meter=String
Text=#timertext#
DynamicVariables=1
MeterStyle=InfoStyle
UpdateDivider=-1
X=r
Y=R
Group=Info

[MeterTimer2]
Meter=String
MeasureName=MeasureTimer
Text= %1
MeterStyle=InfoStyle
X=R
Y=r
Group=Info
FontWeight=900

[MeterProgressBarContainer]
Meter=Shape
X=(#Padding#*#Size#)
Y=(#Padding#/2)R
Shape=Rectangle 0,0,(#MeterW#-(#Padding#*2*#Size#)),(10*#Size#),(5*#Size#)|Fill Color 96,96,96|StrokeWidth=0
UpdateDivider=-1

[MeterProgressBarBack]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(#MeterW#-#Padding#*2*#Size#),(10*#Size#),(5*#Size#)|Fill Color 96,96,96|StrokeWidth=0
UpdateDivider=-1
Container=MeterProgressBarContainer

[MeterProgressBar]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(([MeasureProgressCalc])*(#MeterW#-#Padding#*2*#Size#)),(10*#Size#),(5*#Size#)|Fill LinearGradient GradientPink|StrokeWidth 0
GradientPink=180 | 255,184,232 ; 0.0  | 255,59,133 ; (1.0+(1-[MeasureProgressCalc]))
DynamicVariables=1
Shape2=Rectangle 0,0,([MeasureProgressCalc]*(#MeterW#-#Padding#*2*#Size#)),(10*#Size#),(5*#Size#)|Fill LinearGradient Highlight|StrokeWidth 0
Highlight=90 | 0,0,0,0 ; 0.5| 255,255,255,102 ; 0.5|
UpdateDivider=1800
Group=Info
Container=MeterProgressBarContainer

[MeterBonusContainer]
Meter=Shape
X=(#Padding#*#Size#)
Y=(#Padding#/2)R
Shape=Rectangle 0,0,(#MeterW#-#Padding#*2*#Size#),(#ImgSize#*#Size#)
UpdateDivider=-1

[MeterMemberCardId1]
Meter=Image
MeasureName=MemberCardImg1
X=0
Y=0
H=[MeterBonusContainer:H]
UpdateDivider=-1
DynamicVariables=1
PreserveAspectRatio=1
Group=Info
LeftMouseUpAction=[https://bdon.yatta.moe/info/membercards/[#memberCardId1]]
Container=MeterBonusContainer
Hidden=1

[MeterMemberCardId1Bonus]
Meter=String
Text=[#memberCardId1Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterMemberCardId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[MeterMemberCardId2]
Meter=Image
MeasureName=MemberCardImg2
X=(5*#Size#)R
Y=-([MeterMemberCardId1:H]/4)
H=[MeterBonusContainer:H]
UpdateDivider=-1
DynamicVariables=1
PreserveAspectRatio=1
Group=Info
LeftMouseUpAction=[https://bdon.yatta.moe/info/membercards/[#memberCardId2]]
Container=MeterBonusContainer
Hidden=1

[MeterMemberCardId2Bonus]
Meter=String
Text=[#memberCardId2Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterMemberCardId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[MeterMemberCardId3]
Meter=Image
MeasureName=MemberCardImg3
X=(5*#Size#)R
Y=-([MeterMemberCardId1:H]/4)
H=[MeterBonusContainer:H]
UpdateDivider=-1
DynamicVariables=1
PreserveAspectRatio=1
Group=Info
LeftMouseUpAction=[https://bdon.yatta.moe/info/membercards/[#memberCardId3]]
Container=MeterBonusContainer
Hidden=1

[MeterMemberCardId3Bonus]
Meter=String
Text=[#memberCardId3Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterMemberCardId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[MeterBandId1]
Meter=Image
ImageName=#@#\attributes\BandIcon[#bandId1].webp
X=(5*#Size#)R
Y=-([MeterBandId1:H]/4)
H=[MeterBonusContainer:H]
PreserveAspectRatio=1
UpdateDivider=-1
DynamicVariables=1
Group=Info
MeterStyle=BonusImg
Container=MeterBonusContainer
Hidden=1

[MeterBandId1Bonus]
Meter=String
Text=[#bandId1Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterBandId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[MeterBandId2]
Meter=Image
ImageName=#@#\attributes\BandIcon[#bandId2].webp
X=(5*#Size#)R
Y=-([MeterBandId1:H]/4)
H=[MeterBonusContainer:H]
PreserveAspectRatio=1
UpdateDivider=-1
DynamicVariables=1
Group=Info
MeterStyle=BonusImg
Container=MeterBonusContainer
Hidden=1

[MeterBandId2Bonus]
Meter=String
Text=[#bandId2Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterBandId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[MeterCardType1]
Meter=Image
ImageName=#@#\attributes\CardType[#cardType1].webp
X=(5*#Size#)R
Y=-([MeterBandId1:H]/4)
H=[MeterBonusContainer:H]
PreserveAspectRatio=1
UpdateDivider=-1
DynamicVariables=1
Group=Info
MeterStyle=BonusImg
Container=MeterBonusContainer
Hidden=1

[MeterCardType1Bonus]
Meter=String
Text=[#cardType1Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterBandId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[MeterCardType2]
Meter=Image
ImageName=#@#\attributes\CardType[#cardType2].webp
X=(5*#Size#)R
Y=-([MeterBandId1:H]/4)
H=[MeterBonusContainer:H]
PreserveAspectRatio=1
UpdateDivider=-1
DynamicVariables=1
Group=Info
MeterStyle=BonusImg
Container=MeterBonusContainer
Hidden=1

[MeterCardType2Bonus]
Meter=String
Text=[#cardType2Bonus]%
UpdateDivider=-1
MeterStyle=InfoStyle
X=(5*#Size#)R
Y=([MeterBandId1:H]/4)
Group=Info
Container=MeterBonusContainer
Hidden=1

[LogoImgDl]
Measure=WebParser
URL=https://bdon.yatta.moe/Resources/[#displayLanguage]/Assets/AddressableResources/Image/Event/[#logoImg].webp
Group=ImgDL
Download=1
DynamicVariables=1
FinishAction=[!DisableMeasure LogoImgDl][!UpdateMeterGroup Info]

[BGImgDl]
Measure=WebParser
URL=https://bdon.yatta.moe/Resources/[#displayLanguage]/Assets/AddressableResources/Image/Event/[#bgImg].webp
Group=ImgDL
Download=1
DynamicVariables=1
FinishAction=[!DisableMeasure BGImgDl][!UpdateMeterGroup Info]

[MemberCardImg1]
Measure=WebParser
URL=https://bdon.yatta.moe/Resources/[#displayLanguage]/Assets/AddressableResources/MemberCard/[#memberCardId1]/member_thumbnail.webp
Group=ImgDL
Download=1
DynamicVariables=1
OnDownloadErrorAction=[!HideMeter MeterMemberCardId1][!HideMeter MeterMemberCardId1Bonus]
FinishAction=[!DisableMeasure MemberCardImg1][!UpdateMeterGroup Info]

[MemberCardImg2]
Measure=WebParser
URL=https://bdon.yatta.moe/Resources/[#displayLanguage]/Assets/AddressableResources/MemberCard/[#memberCardId2]/member_thumbnail.webp
Group=ImgDL
Download=1
DynamicVariables=1
OnDownloadErrorAction=[!HideMeter MeterMemberCardId2][!HideMeter MeterMemberCardId2Bonus]
FinishAction=[!DisableMeasure MemberCardImg2][!UpdateMeterGroup Info]

[MemberCardImg3]
Measure=WebParser
URL=https://bdon.yatta.moe/Resources/[#displayLanguage]/Assets/AddressableResources/MemberCard/[#memberCardId3]/member_thumbnail.webp
Group=ImgDL
Download=1
DynamicVariables=1
OnDownloadErrorAction=[!HideMeter MeterMemberCardId3][!HideMeter MeterMemberCardId3Bonus]
FinishAction=[!DisableMeasure MemberCardImg3][!UpdateMeterGroup Info]

[MeasureTime]
Measure=Time

[MeasureTimerCalc]
Measure=Calc
Formula=([#startAt]+11644473600+(#UTCOffset#*3600)) < MeasureTime ? (([#endAt]+11644473600+(#UTCOffset#*3600))-MeasureTime):(([#startAt]+11644473600+(#UTCOffset#*3600))-MeasureTime)
IfCondition=([#startAt]+11644473600+(#UTCOffset#*3600)) < MeasureTime
IfTrueAction=[!SetVariable TimerText [#EndText]][!ShowMeter MeterProgressBar]
IfFalseAction=[!SetVariable TimerText [#StartText]][!HideMeter MeterProgressBar]
IfCondition2=MeasureTimerCalc < 86400
IfTrueAction2=[!SetOption MeasureTimer Format "%H[#hour]%M[#minute]%S[#second]"][!SetVariable dayoffset 0]
IfFalseAction2=[!SetOption MeasureTimer Format "%e[#day]%H[#hour]%M[#minute]%S[#second]"][!SetVariable dayoffset 86400]
IfCondition3=MeasureTimerCalc<0
IfTrueAction3=[!HideMeter MeterTimer1][!HideMeter MeterTimer2]
IfFalseAction3=[!ShowMeter MeterTimer1][!ShowMeter MeterTimer2]
Group=Calcs
DynamicVariables=1

[MeasureTimer]
Measure=Time
TimeStamp=([MeasureTimerCalc]-#dayoffset#)
DynamicVariables=1

[MeasureProgressCalc]
Measure=Calc
Formula=(MeasureTime-([#startAt]+11644473600+(#UTCOffset#*3600)))/(([#endAt]+11644473600+(#UTCOffset#*3600))-([#startAt]+11644473600+(#UTCOffset#*3600)))
InvertMeasure=#InvertProgress#
Group=Calcs
DynamicVariables=1
